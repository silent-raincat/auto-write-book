- 注册/登录/退出（邮箱、手机、第三方登录）
- 用户资料与偏好设置（昵称、头像、语言、写作偏好）
- API Key/模型凭证管理（ModelScope/OpenAI 等）
- 会员体系与计费（套餐、额度、发票、订单）
- 项目/作品管理（新建、归档、删除、搜索、标签）
- 小说基础设定（题材、风格、受众、禁忌、分级）
- 世界观管理（地图、势力、制度、历史年表）
- 角色库（人物卡、关系网、成长线、出场记录）
- 地点/物品/设定库（可复用素材库）
11- 大纲生成与编辑（故事线、分卷分章、节奏曲线）
11- 章节管理（新建、排序、版本、草稿/发布状态）
- 富文本/Markdown 编辑器（排版、快捷键、自动保存）
11- AI 续写（基于当前章节/上一章/大纲/设定）
- AI 改写（扩写、精简、换视角、换风格、润色）
- AI 对话式创作（边聊边生成、可引用上下文）
- 多模型选择（不同模型、不同能力、不同价格）
- 提示词模板库（场景模板、人物模板、风格模板）
- 参数控制（温度、长度、角色扮演、思考开关）
- 生成结果对比（多候选、并排对照、一键采纳）
- 引用与溯源（显示用了哪些设定/知识库条目）
- 知识库（上传文档、摘要、向量检索、引用到生成）
- 素材剪藏（网页/文本摘录、标注、分类）
- 一致性检查（姓名/时间线/设定冲突提示）
- 术语表与别名（同义词、译名、统一用词）
- 敏感内容与合规过滤（自定义规则、平台规则）
- 协作与权限（多人协作、评论、审阅、角色权限）
- 版本历史与回滚（章/段落级版本、差异对比）
- 导出（DOCX/PDF/EPUB/TXT/Markdown）
- 发布（连载平台格式适配、定时发布、章节分割）
- 数据统计（字数、更新频率、角色出场统计）
- 任务看板（待写章节、待修订、待校对）
- 校对工具（错别字、语法、标点、重复词）
- 语料/风格训练（个人写作偏好、示例对齐）
- 插件/扩展（自定义工具、工作流、webhook）
- 日志与审计（生成记录、消耗、错误原因追踪）
- 运维监控（延迟、失败率、模型可用性告警）
- 备份与恢复（自动备份、跨设备同步）
- 安全（加密存储、脱敏、风控、限流）
- 多端支持（Web/桌面/移动端、自适应）
- 新手引导与示例工程（模板、教程、最佳实践）